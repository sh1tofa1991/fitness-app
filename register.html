<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — COOLBOYDRACO GYM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__brand">
        <img src="assets/logo.png" alt="COOLBOYDRACO GYM" class="site-logo" width="52" height="52">
        <span class="site-header__title">COOLBOYDRACO GYM</span>
      </a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="profile.html">Профиль</a>
        <a href="settings.html">Настройки</a>
      </nav>
    </div>
  </header>

  <main class="page page--centered">
    <div class="auth-centered">
      <div class="panel auth-form-panel">
        <h1 class="panel__title">Новый пользователь</h1>
        <p class="panel__subtitle">Создайте аккаунт за минуту</p>
        <form class="form-stack" id="register-form">
          <div class="form-group">
            <label class="input-wrap">
              <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" name="name" placeholder="Имя" required>
            </label>
          </div>
          <div class="form-group">
            <label class="input-wrap">
              <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
              <input type="email" name="email" placeholder="Эл. почта" required>
            </label>
          </div>
          <div class="form-group">
            <label class="input-wrap">
              <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" name="password" placeholder="Пароль" required>
            </label>
          </div>
          <div class="form-group">
            <label class="input-wrap">
              <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" name="password_confirm" placeholder="Подтверждение пароля" required>
            </label>
          </div>
          <button type="submit" class="btn btn--primary">Создать аккаунт</button>
          <a href="index.html" class="btn">Уже есть аккаунт? Войти</a>
        </form>
      </div>

      <aside class="panel">
        <h2 class="panel__title">Что будет в профиле</h2>
        <ul class="list-cards">
          <li class="list-cards__item">История тренировок</li>
          <li class="list-cards__item">Калории и время</li>
          <li class="list-cards__item">Достижения</li>
          <li class="list-cards__item">Настройки аккаунта</li>
        </ul>
      </aside>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
