<!DOCTYPE html>
<html lang="ru" data-page="catalog">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Каталог — COOLBOYDRACO GYM</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth-guard.js"></script>
</head>
<body data-page="catalog">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__brand">
        <img src="assets/logo.png" alt="COOLBOYDRACO GYM" class="site-logo" width="52" height="52">
        <span class="site-header__title">COOLBOYDRACO GYM</span>
      </a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="catalog.html" class="is-active">Каталог</a>
        <a href="profile.html">Профиль</a>
        <a href="settings.html">Настройки</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="catalog-header-row">
      <h1 class="page-heading">Каталог тренировок</h1>
      <button type="button" class="btn btn--primary" id="btn-create-workout">+ Создать тренировку</button>
    </div>

    <div class="catalog-toolbar">
      <label class="search-bar">
        <i data-lucide="search" class="search-bar__icon" aria-hidden="true"></i>
        <input type="search" id="search-input" placeholder="Поиск тренировки" aria-label="Поиск тренировки">
      </label>
      <div class="filter-chips" id="filter-chips">
        <button type="button" class="chip" data-filter="goal">Цель</button>
        <button type="button" class="chip" data-filter="level">Уровень</button>
        <button type="button" class="chip" data-filter="duration">Длительность</button>
        <button type="button" class="chip" data-filter="reset">Фильтр</button>
      </div>
    </div>

    <div class="catalog-layout">
      <aside class="panel sidebar-categories">
        <h2 class="panel__title">Категории</h2>
        <ul class="list-cards">
          <li class="list-cards__item is-active" data-category="Все">Все</li>
          <li class="list-cards__item" data-category="Силовые">Силовые</li>
          <li class="list-cards__item" data-category="Кардио">Кардио</li>
          <li class="list-cards__item" data-category="Растяжка">Растяжка</li>
          <li class="list-cards__item" data-category="Йога">Йога</li>
          <li class="list-cards__item" data-category="Для дома">Для дома</li>
          <li class="list-cards__item" data-category="Для зала">Для зала</li>
        </ul>
      </aside>

      <section class="workout-grid" id="workout-grid" aria-label="Список тренировок"></section>
    </div>
  </main>

  <div class="modal-overlay" id="modal-create">
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <h2 class="modal__title" id="modal-title">Новая тренировка</h2>
      <p class="panel__subtitle">Создайте свою программу</p>
      <form id="create-workout-form" class="form-stack">
        <div class="form-group">
          <label class="form-label" for="create-title">Название</label>
          <label class="input-wrap" for="create-title">
            <input type="text" id="create-title" name="title" placeholder="Например, Утренняя силовая" required>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" for="create-category">Категория</label>
          <div class="select-wrap">
            <select id="create-category" name="category" required>
              <option value="Силовые">Силовые</option>
              <option value="Кардио">Кардио</option>
              <option value="Растяжка">Растяжка</option>
              <option value="Йога">Йога</option>
              <option value="Для дома">Для дома</option>
              <option value="Для зала">Для зала</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="create-type">Тип</label>
          <label class="input-wrap" for="create-type">
            <input type="text" id="create-type" name="type" placeholder="Например, Силовая">
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" for="create-duration">Длительность (мин)</label>
          <label class="input-wrap" for="create-duration">
            <input type="number" id="create-duration" name="duration" placeholder="30" min="5" max="120" value="30" required>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" for="create-level">Уровень</label>
          <div class="select-wrap">
            <select id="create-level" name="level" required>
              <option value="лёгкий">лёгкий</option>
              <option value="средний">средний</option>
              <option value="высокий">высокий</option>
              <option value="продвинутый">продвинутый</option>
            </select>
          </div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn" id="modal-cancel">Отмена</button>
          <button type="submit" class="btn btn--primary">Создать</button>
        </div>
      </form>
    </div>
</div>

  <script src="js/vendor/lucide.min.js"></script>
  <script src="js/lucide-bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
