<!DOCTYPE html>
<html lang="ru" data-page="forgot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Восстановление — COOLBOYDRACO GYM</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth-guard.js"></script>
</head>
<body data-page="forgot">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__brand">
        <img src="assets/logo.png" alt="COOLBOYDRACO GYM" class="site-logo" width="52" height="52">
        <span class="site-header__title">COOLBOYDRACO GYM</span>
      </a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="profile.html">Профиль</a>
        <a href="settings.html">Настройки</a>
      </nav>
    </div>
  </header>

  <main class="page page--centered">
    <div class="panel auth-single">
      <h1 class="panel__title">Сброс пароля</h1>
      <p class="panel__subtitle">Введите эл. почту или телефон</p>
      <form class="form-stack" id="forgot-form">
        <div class="form-group">
          <label class="input-wrap">
            <i data-lucide="key-round" class="input-wrap__icon" aria-hidden="true"></i>
            <input type="text" name="contact" placeholder="Эл. почта или телефон" required>
          </label>
        </div>
        <button type="submit" class="btn btn--primary">Продолжить</button>
        <a href="index.html" class="btn">Назад ко входу</a>
      </form>
      <p class="form-hint">Введите контакт, на который придёт код восстановления. Код действителен 15 минут.</p>
    </div>
  </main>
  <script src="js/vendor/lucide.min.js"></script>
  <script src="js/lucide-bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
